name: Deploy to Telegram Serverless

on:
  push:
    branches: [tgcloud-migration]
  workflow_dispatch:

concurrency:
  group: tgcloud-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # BotFather → bot → Serverless → CLI Access dan olingan token.
      TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
      # Ixtiyoriy: heartbeat tajribasi uchun (initData imzolash). Faqat bot bazasiga yoziladi.
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      ADMIN_CTX: "{ initData: { user: { id: 8808803998 } } }"
    steps:
      - name: Check TGCLOUD_TOKEN secret
        run: |
          if [ -z "$TGCLOUD_TOKEN" ]; then
            echo "::error::TGCLOUD_TOKEN secret topilmadi. GitHub → Settings → Secrets and variables → Actions ga qo'shing."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit testlar
        run: npm test
      # Bulutdagi holatni yuklab olamiz, so'ng faqat o'zgarganlarni yuboramiz
      - run: npx tgcloud fetch
      - run: npx tgcloud push
      # Bazaga faqat xavfsiz o'zgarishlarni (yangi jadval/ustun) qo'llaymiz
      - run: npx tgcloud migrate --safe
      - name: Webhook holati
        run: npx tgcloud webhook --no-pager || true
      - name: Bot tokenini heartbeat uchun saqlash
        if: env.BOT_TOKEN != ''
        run: npx tgcloud run endpoints/admin "{ action: 'setToken', token: '$BOT_TOKEN' }" --ctx "$ADMIN_CTX" > /dev/null
      - name: Runtime diagnostikasi
        run: npx tgcloud run endpoints/admin '{}' --ctx "$ADMIN_CTX"
